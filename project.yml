name: Leftless
options:
  bundleIdPrefix: com.leftless
  deploymentTarget:
    macOS: "15.0"
packages:
  LeftlessCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: $(ARCHS_STANDARD)
targets:
  Leftless:
    type: application
    platform: macOS
    sources:
      - Sources/Leftless
    dependencies:
      - package: LeftlessCore
        product: LeftlessCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.leftless.app
        PRODUCT_NAME: Leftless
        CODE_SIGN_ENTITLEMENTS: App/Leftless.entitlements
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  LeftlessCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LeftlessCoreTests
    dependencies:
      - package: LeftlessCore
        product: LeftlessCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Leftless:
    build:
      targets:
        Leftless: all
        LeftlessCoreTests: [test]
    run:
      config: Debug
      executable: Leftless
    test:
      config: Debug
      targets:
        - LeftlessCoreTests
